{% assign c = "c-tab-section" %}

<div class="{{c}} col col-4 col-d-6 col-t-12">
    <header>
        <nav>
            {% for tab in include.tabs %}
                <a href="#{{tab.title | slugify}}">{{tab.title}}</a>
            {% endfor %}
        </nav>
    </header>
    <section>
        {% for tab in include.tabs %}
            <article id="{{tab.title | slugify}}">
                {{tab.content}}
            </article>
        {% endfor %}
    </section>
</div>
